<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SolarEdge Energy Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="page-header">
        <p class="eyebrow">Solar Analytics</p>
        <h1>Home Energy and Self-Consumption</h1>
        <p class="subtitle">Track day, week, month, and year performance from SolarEdge data.</p>
    </header>

    <main class="page-main">
        <section class="control-panel" aria-label="Chart controls">
            <button type="button" id="refresh-btn" class="refresh-btn">Refresh</button>
        </section>

        <section class="kpi-grid" aria-label="Energy key performance indicators">
            <article class="kpi-card">
                <h2>Consumption</h2>
                <p id="kpi-consumption" class="kpi-value">-</p>
            </article>
            <article class="kpi-card">
                <h2>Production</h2>
                <p id="kpi-production" class="kpi-value">-</p>
            </article>
            <article class="kpi-card">
                <h2>Self-Consumption</h2>
                <p id="kpi-self-consumption" class="kpi-value">-</p>
            </article>
        </section>

        <section class="chart-panel" aria-labelledby="energy-chart-title">
            <div class="chart-header">
                <h2 id="energy-chart-title">Energy by interval</h2>
                <article class="date-selector chart-date-selector" aria-label="Date range selector">
                    <label for="start-date" class="sr-only">Start date</label>
                    <button type="button" id="prev-day-btn" class="range-btn day-nav-btn" aria-label="Move to previous day">&lt;</button>
                    <input type="date" id="start-date" name="startDate">
                    <span class="date-separator">to</span>
                    <label for="end-date" class="sr-only">End date</label>
                    <input type="date" id="end-date" name="endDate">
                    <button type="button" id="next-day-btn" class="range-btn day-nav-btn" aria-label="Move to next day">&gt;</button>
                </article>
                <article class="view-toggle" aria-label="Chart view mode">
                    <span class="view-toggle-label">Chart view</span>
                    <div class="view-toggle-actions">
                        <button type="button" id="view-mode-positive" class="range-btn view-mode-btn is-active" data-view-mode="positive" aria-pressed="true">All Positive</button>
                        <button type="button" id="view-mode-split" class="range-btn view-mode-btn" data-view-mode="split" aria-pressed="false">Positive / Negative</button>
                    </div>
                </article>
                <p id="chart-meta"></p>
            </div>
            <canvas id="energy-chart" aria-label="Energy chart" role="img"></canvas>
            <div id="daily-charts" class="daily-charts" aria-label="Daily energy charts" hidden></div>
        </section>

        <section class="live-panel" aria-labelledby="live-power-title">
            <h2 id="live-power-title">Live Power Flow</h2>
            <div class="live-panel-stack">
                <dl class="live-grid">
                    <div>
                        <dt>PV</dt>
                        <dd id="live-pv">-</dd>
                    </div>
                    <div>
                        <dt>Load</dt>
                        <dd id="live-load">-</dd>
                    </div>
                    <div>
                        <dt>Grid</dt>
                        <dd id="live-grid">-</dd>
                    </div>
                </dl>

                <article class="live-self-rate-card" aria-label="Self-consumption rate details">
                    <h3>Self-Consumption Rate</h3>
                    <div id="kpi-self-rate-gauge" class="self-rate-gauge" role="img" aria-label="Self-consumption rate gauge">
                        <div class="self-rate-gauge-inner">
                            <p id="kpi-self-rate" class="kpi-value">-</p>
                            <p class="self-rate-caption">self-used</p>
                        </div>
                    </div>
                    <div class="self-split-bar" role="img" aria-label="Solar production split between self-use and export">
                        <span id="kpi-self-solar-fill" class="self-split-self"></span>
                        <span id="kpi-self-export-fill" class="self-split-export"></span>
                    </div>
                    <p id="kpi-self-split-label" class="kpi-subtext">-</p>
                    <p id="kpi-self-rate-label" class="kpi-subtext">-</p>
                </article>
            </div>
        </section>

        <p id="error-banner" class="error-banner" hidden></p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script>
    <script src="script.js" type="module"></script>
</body>
</html>
